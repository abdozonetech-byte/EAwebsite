name: SEO audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    name: Validate indexability signals
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pinned dependencies
        run: npm ci

      - name: Check source and types
        run: npm run lint && npm run typecheck

      - name: Build public artifact and audit SEO
        run: npm run build

      - name: Run all regression groups
        run: npm test
